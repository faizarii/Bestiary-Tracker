plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = '0.1.0'
group = 'com.example.skyblockbestiary'

base {
    archivesName = 'skyblock-bestiary-tracker'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand 'version': version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 25
}

tasks.register('checkIconPersistence', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.skyblockbestiary.data.BestiaryIconCheck'
    enableAssertions = true
}

tasks.named('check') {
    dependsOn 'checkIconPersistence'
}

tasks.named('test') {
    // Tests use the standalone check above rather than a test framework.
    failOnNoDiscoveredTests = false
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
